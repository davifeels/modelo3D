[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mostra detalhes de cada teste
addopts =
    -v
    --tb=short
    --no-header
    -p no:warnings

# Marcadores customizados
markers =
    slow: testes lentos (usa meshes grandes ou boolean ops)
    api: testes de integração HTTP (servidor deve estar rodando)
