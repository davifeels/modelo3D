server {
    listen 80;
    server_name _;

    # Não revela a versão do nginx no header Server
    server_tokens off;

    # Uploads de STL/OBJ podem ser grandes
    client_max_body_size 300m;

    # ── Headers de segurança (aplicados a todas as respostas) ──
    # Clickjacking: a app nunca deve ser embutida em iframe de terceiros
    add_header X-Frame-Options "DENY" always;
    # Impede MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Não vaza a URL completa como referer para outros sites
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Desliga APIs sensíveis do navegador que a app não usa
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: só tem efeito sob HTTPS (ignorado em HTTP), seguro deixar ligado
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: mesma origem por padrão; imagens externas (ex.: Unsplash na landing)
    # e data: liberadas; workers/wasm do Three.js via blob:; sem frames de fora.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API → serviço backend do compose
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Operações booleanas em malhas grandes demoram
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
